<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="munis-mark-title">
  <title id="munis-mark-title">MUNIS mark: two flowing emerald forms with a gold destination point</title>
  <!-- Companion form: protective sweep -->
  <path d="M 30.17 12.08 A 21 21 0 1 0 51.03 41.88" fill="none" stroke="#005A47" stroke-width="8" stroke-linecap="round"/>
  <!-- Pilgrim form: nested inner arc (subtle reference to the letter م) -->
  <path d="M 31.75 30.01 A 7.5 7.5 0 1 0 41.25 41.32" fill="none" stroke="#00A67E" stroke-width="6.5" stroke-linecap="round"/>
  <!-- Destination: the gold point of direction and hope -->
  <circle cx="44.04" cy="15.8" r="4.2" fill="#C8A951"/>
</svg>
