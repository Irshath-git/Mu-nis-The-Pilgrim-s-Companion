<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>MUNIS — The Pilgrim's Companion</title>
    <meta
      name="description"
      content="A voice-first, offline-ready and accessibility-first AI companion designed to help Hajj and Umrah pilgrims understand and act upon important journey guidance."
    />

    <link rel="icon" type="image/svg+xml" href="/brand/munis-favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/munis-app-icon-512.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#00372E" />

    <!-- Canonical URL placeholder: replace with the final production domain before launch -->
    <link rel="canonical" href="https://munis-companion.netlify.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MUNIS" />
    <meta property="og:title" content="MUNIS — The Pilgrim's Companion" />
    <meta
      property="og:description"
      content="A voice-first, offline-ready and accessibility-first AI companion designed to help Hajj and Umrah pilgrims understand and act upon important journey guidance."
    />
    <meta property="og:image" content="/brand/munis-og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ar_SA" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MUNIS — The Pilgrim's Companion" />
    <meta
      name="twitter:description"
      content="A voice-first, offline-ready and accessibility-first AI companion for Hajj and Umrah pilgrims."
    />
    <meta name="twitter:image" content="/brand/munis-og.png" />
  </head>
  <body>
    <div id="root"></div>

    <!--
      Static form definition so Netlify Forms detects the contact form at build time.
      The visible React form posts URL-encoded data with the same form-name.
    -->
    <form
      name="pilot-interest"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
      aria-hidden="true"
    >
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="text" name="organisation" />
      <input type="text" name="role" />
      <input type="email" name="email" />
      <select name="interest"></select>
      <textarea name="message"></textarea>
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
